<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 안주 추천</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>오늘의 안주 추천</h1>
      <p class="subtitle">술과 날씨를 선택하면 딱 맞는 안주를 알려드려요</p>
    </div>

    <div class="form-section">
      <div class="input-group">
        <label for="drink-select">술 종류</label>
        <div class="select-wrapper">
          <select id="drink-select">
            <option value="">선택하세요</option>
            <option value="soju">소주</option>
            <option value="beer">맥주</option>
            <option value="makgeolli">막걸리</option>
            <option value="wine">와인</option>
            <option value="whiskey">위스키</option>
            <option value="cocktail">칵테일</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="weather-select">날씨</label>
        <div class="select-wrapper">
          <select id="weather-select">
            <option value="">선택하세요</option>
            <option value="hot">더운 날 (30도 이상)</option>
            <option value="warm">따뜻한 날 (20~29도)</option>
            <option value="cool">선선한 날 (10~19도)</option>
            <option value="cold">추운 날 (10도 이하)</option>
            <option value="rainy">비 오는 날</option>
            <option value="snowy">눈 오는 날</option>
          </select>
        </div>
      </div>

      <button id="recommend-btn" onclick="recommend()">안주 추천받기</button>
    </div>

    <div id="result" class="result hidden">
      <div class="result-header">
        <span id="result-emoji" class="result-emoji"></span>
        <h2 id="result-title"></h2>
      </div>
      <p id="result-desc" class="result-desc"></p>
      <div id="result-items" class="result-items"></div>
      <p id="result-tip" class="result-tip"></p>
    </div>
  </div>

  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
